name: Deploy Vue app to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          # 1. Pass the secret to Bash as an environment variable first
          COUPON_SECRET: ${{ secrets.COUPON_DATA }}
        run: |
          # 2. Create the base .env file with Firebase keys
          echo "${{ secrets.ENV_FILE }}" > .env
          
          # 3. Force a newline
          echo "" >> .env
          
          # 4. Safely append using the Bash variable. 
          # Because $COUPON_SECRET is evaluated at runtime, Bash won't eat the quotes!
          echo "VITE_COUPON_DATA='${COUPON_SECRET}'" >> .env
          
          # 5. Run the SSG build
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4