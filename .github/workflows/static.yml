name: Deploy Vue app to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: |
          # Create the base .env file
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

          # Append coupon JSON as a Vite env variable
          printf '\nVITE_COUPON_DATA=%s\n' '${{ secrets.COUPON_DATA }}' >> .env

          # Validate that the coupon JSON exists and parses correctly
          node -e "const fs=require('fs'); const env=fs.readFileSync('.env','utf8'); const m=env.match(/^VITE_COUPON_DATA=(.*)$/m); console.log('Coupon env present:', !!m, 'length:', m ? m[1].length : 0); if (!m) process.exit(1); JSON.parse(m[1]); console.log('Coupon JSON parses OK');"

          # Run the build
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
